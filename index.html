<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF UID Info Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #1e293b; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 20px; text-align: left; display: none; }
        .error { color: #ff4d4d; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>FREE FIRE PLAYER INFO</h1>
    <input type="text" id="uid" placeholder="Enter UID">
    <button onclick="fetchData()">Search Profile</button>
    
    <div id="loader" style="display:none; margin-top:10px;">Fetching...</div>
    <div id="error" class="error"></div>

    <div id="result" class="result">
        <p>Name: <span id="pName"></span></p>
        <p>Level: <span id="pLevel"></span></p>
        <p>Likes: <span id="pLikes"></span></p>
    </div>
</div>

<script>
async function fetchData() {
    const uid = document.getElementById('uid').value;
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const loader = document.getElementById('loader');

    result.style.display = 'none';
    error.style.display = 'none';
    loader.style.display = 'block';

    try {
        // Using a reliable public proxy to bypass CORS
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://ff-info-ro45.vercel.app/api?uid=' + uid + '&key=Anurag')}`);
        const data = await response.json();
        const player = JSON.parse(data.contents);

        if(player.basicInfo) {
            document.getElementById('pName').innerText = player.basicInfo.nickname;
            document.getElementById('pLevel').innerText = player.basicInfo.level;
            document.getElementById('pLikes').innerText = player.basicInfo.liked;
            result.style.display = 'block';
        } else {
            throw new Error("Data not found");
        }
    } catch(e) {
        error.innerText = "Failed to fetch. Check API or UID.";
        error.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
}
</script>

</body>
</html>
