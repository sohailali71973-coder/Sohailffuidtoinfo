<script>
async function fetchData() {
    const uid = document.getElementById('uid').value;
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const loader = document.getElementById('loader');

    result.style.display = 'none';
    error.style.display = 'none';
    loader.style.display = 'block';

    // API URL
    const apiUrl = 'https://ff-info-ro45.vercel.app/api?uid=' + uid + '&key=Anurag';
    
    // API calling via a reliable CORS proxy
    const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(apiUrl);

    try {
        const response = await fetch(proxyUrl);
        const data = await response.json();
        
        // allorigins.win returns data inside a 'contents' field
        const player = JSON.parse(data.contents);

        if(player.basicInfo) {
            document.getElementById('pName').innerText = player.basicInfo.nickname;
            document.getElementById('pLevel').innerText = player.basicInfo.level;
            document.getElementById('pLikes').innerText = player.basicInfo.liked;
            result.style.display = 'block';
        } else {
            throw new Error("No data found");
        }
    } catch(e) {
        console.error(e);
        error.innerText = "Error: " + e.message;
        error.style.display = 'block';
    } finally {
        loader.style.display = 'none';
    }
}
</script>
